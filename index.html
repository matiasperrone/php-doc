<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHP Manual</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <div class="bar__nav">
    <button id="back" class="icon" data-t-title="nav.back" data-t-aria="nav.back">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button id="fwd" class="icon" data-t-title="nav.forward" data-t-aria="nav.forward">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <button id="home" class="icon" data-t-title="nav.home" data-t-aria="nav.home">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7 8 2.5 13.5 7v6.5h-4V10h-3v3.5h-4z"/></svg>
    </button>
  </div>

  <h1 class="bar__title" id="docTitle"></h1>

  <div class="bar__nav">
    <button id="locate" class="icon" data-t-title="nav.locate" data-t-aria="nav.locate">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
    </button>
    <button id="theme" class="icon" data-t-title="nav.theme" data-t-aria="nav.theme">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5"/></svg>
    </button>
  </div>
</header>

<main class="shell">
  <aside class="side" id="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-panel="toc"    data-t="tab.contents" aria-selected="true"></button>
      <button class="tab" role="tab" data-panel="idx"    data-t="tab.index"    aria-selected="false"></button>
      <button class="tab" role="tab" data-panel="search" data-t="tab.search"   aria-selected="false"></button>
    </div>

    <section class="panel" data-panel="toc">
      <div class="panel__body tree" id="tree" role="tree" data-t-aria="aria.tree"></div>
    </section>

    <section class="panel" data-panel="idx" hidden>
      <div class="field">
        <input id="idxQ" type="search" data-t-ph="field.index" autocomplete="off" spellcheck="false">
      </div>
      <div class="panel__body" id="idxList"></div>
    </section>

    <section class="panel" data-panel="search" hidden>
      <div class="field">
        <input id="q" type="search" data-t-ph="field.search" autocomplete="off" spellcheck="false">
      </div>
      <div class="panel__body" id="results"></div>
    </section>

    <footer class="side__foot">
      <span id="stat"></span>
      <select id="lang" class="lang" data-t-aria="aria.lang" hidden></select>
    </footer>
  </aside>

  <div class="grip" id="grip" role="separator" aria-orientation="vertical" tabindex="0"
       data-t-aria="aria.grip"></div>

  <div class="doc">
    <iframe id="doc" data-t-title="aria.doc" src="about:blank"></iframe>
    <nav class="seq">
      <button id="prev" class="seq__btn" data-t="seq.prev"></button>
      <span class="seq__where" id="where"></span>
      <button id="next" class="seq__btn" data-t="seq.next"></button>
    </nav>
  </div>
</main>

<!-- ==================================================================
     Cadenas de la interfaz. Para añadir un idioma: copiá un bloque,
     cambiá data-lang / data-locale / data-label y traducí los valores.
     Sólo se traduce la interfaz; el manual queda en su idioma original.
     {llaves} son marcadores que el visor reemplaza en tiempo de ejecución.
     ================================================================== -->
