 <h2 class="title">Mixed</h2>

 <p class="para">
  The <span class="type"><a href="language.types.mixed.html" class="type mixed">mixed</a></span> type accepts every value. It is equivalent to the
  <a href="language.types.type-system.html#language.types.type-system.composite.union" class="link">union type</a>
  
  <code class="literal">object|resource|array|string|float|int|bool|null</code>.
  Available as of PHP 8.0.0.
 </p>

 <p class="simpara">
  <span class="type"><a href="language.types.mixed.html" class="type mixed">mixed</a></span> is, in type theory parlance, the top type,
  meaning every other type is a subtype of it.
 </p>
