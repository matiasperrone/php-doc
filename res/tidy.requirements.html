      <div id="layout-content"><div id="tidy.requirements" class="section">
  <h2 class="title">Requirements</h2>
  <p class="para">
   To use Tidy, you will need libtidy installed, available
   on the <a href="http://tidy.sourceforge.net/" class="link external" title="Link : http://tidy.sourceforge.net/">&raquo;&nbsp;tidy homepage</a>.
   As of PHP 7.1.0, the HTML5 aware successor
   <a href="http://www.html-tidy.org/" class="link external" title="Link : http://www.html-tidy.org/">&raquo;&nbsp;libtidy5</a> can be used alternatively.
   As of PHP 7.3.0, another option is to use <a href="https://github.com/petdance/tidyp" class="link external" title="Link : https://github.com/petdance/tidyp">&raquo;&nbsp;libtidyp</a>.
  </p>
